name: search-scripts

on:
  push:
    paths:
      - "plugins/soundings/skills/search/scripts/*.py"
      - ".github/workflows/evidence.yml"
  pull_request:
    paths:
      - "plugins/soundings/skills/search/scripts/*.py"
      - ".github/workflows/evidence.yml"

permissions:
  contents: read

jobs:
  unittest:
    name: search scripts (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run search-script unit tests
        run: python -m unittest discover -s plugins/soundings/skills/search/scripts -p "test_*.py" -v
