<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1225.031 517.4" role="img" aria-labelledby="title desc" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="18" fill="#183D47"><rect x="0" y="0" width="1225.031" height="517.4" fill="#F7F5EF"/><title id="title">Soundings — 从源码到实际使用 / source to use</title><desc id="desc">The public marketplace manifest points to plugins/soundings. Marketplace refresh updates a derived marketplace snapshot; installation produces a derived enabled package. A fresh task can discover its skills. Discovery, selection, task result and general effectiveness are separate observations; installing does not hot reload an already-running task.</desc><marker refX="5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto" viewBox="0 0 10 10" id="m0"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526970" stroke="#526970" stroke-width="1px" stroke-dasharray="1px, 0px"/></marker><path d="M612.516,133.8L612.516,164.8L612.516,191.8" fill="none" stroke="#526970" stroke-width="1.5px" marker-end="url(#m0)"/><path d="M612.516,321.6L612.516,352.6L612.516,379.6" fill="none" stroke="#526970" stroke-width="1.5px" marker-end="url(#m0)"/><g transform="translate(612.516, 164.8)"><g transform="translate(-56, -12)"><rect x="-2" y="0" width="112" height="24" fill="#f7f5ef" opacity="0.5"/><text y="-10.1" fill="#183d47"><tspan x="0" y="-0.1em" dy="1.1em">刷新市场副本</tspan></text></g></g><g transform="translate(612.516, 352.6)"><g transform="translate(-47, -12)"><rect x="-2" y="0" width="94" height="24" fill="#f7f5ef" opacity="0.5"/><text y="-10.1" fill="#183d47"><tspan x="0" y="-0.1em" dy="1.1em">开始新任务</tspan></text></g></g><g transform="translate(0, 375.6)"><rect x="8" y="8" width="1209.031" height="125.8" fill="#f7f5ef" stroke="#8a9fa3" stroke-width="1px"/><g transform="translate(567.492, 8)"><text y="-10.1" fill="#080a10" font-weight="600"><tspan x="0" y="-0.1em" dy="1.1em">03 · 新任务</tspan></text></g><path d="M279.531,70.9L349.031,70.9L