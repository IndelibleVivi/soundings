<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 716.945 1148.8" role="img" aria-labelledby="title desc" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="18" fill="#183D47"><rect x="0" y="0" width="716.945" height="1148.8" fill="#F7F5EF"/><title id="title">Soundings — 可选证据工具 / optional evidence support</title><desc id="desc">Existing tools acquire material. A selected UTF-8 file is explicitly captured to a stable local snapshot. Read and find return whole ranges with byte budgets and omissions. Packet create copies an explicit brief and selected snapshots into a new directory; manifest is written last. A recipient inspects then rereads the copied evidence. None of these helpers uploads or executes a research task.</desc><marker refX="5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto" viewBox="0 0 10 10" id="m0"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526970" stroke="#526970" stroke-width="1px" stroke-dasharray="1px, 0px"/></marker><path d="M195.031,87.8L195.031,118.8L195.031,145.8" fill="none" stroke="#526970" stroke-width="1.5px" marker-end="url(#m0)"/><path d="M195.031,229.6L195.031,260.6L195.031,287.6" fill="none" stroke="#526970" stroke-width="1.5px" marker-end="url(#m0)"/><path d="M195.031,371.4L195.031,402.4L195.031,429.4" fill="none" stroke="#526970" stroke-width="1.5px" marker-end="url(#m0)"/><path d="M170.994,533L156.031,564L156.031,591" fill="none" stroke="#526970" stroke-width="1.5px" marker-end="url(#m0)"/><path d="M156.031,674.8L156.031,705.8L156.031,732.8" fill="none" stroke="#526970" stroke-width="1.5px" marker-end="url(#m0)"/><path d="M305.548,533L374.344,564L436.316,593.291" fill="none" stroke="#526970" stroke-width="1.5px" stroke-dasharray="2px" marker-end="url(#m0)"/><path d="M573.605,523.1L573.605,564L554.352,591.715" fill="none" stroke="#526970" stroke-width="1.5px" marker-end="url(#m0)"/><path d="M524.352,674.8L524.352,705.8L524.352,733.3" fill="none" stroke="#526970" stroke-width="1.5px" marker-end="url(#m0)"/><path d="M524.352,836.9L524.352,868.4L524.352,895.4" fill="none" stroke="#526970" stroke-width="1.5px" marker-end="url(#m0)"/><path d="M524.352,979.2L524.352,1010.2L524.352,1037.2" fill="none" stroke="#526970" stroke-width="1.5px" marker-end="url(#m0)"/><g transform="translate(195.031, 118.8)"><g transform="translate(-56, -12)"><rect x="-2" y="0" width="112" height="24" fill="#f7f5ef" opacity="0.5"/><text y="-10.1" fill="#183d47"><tspan x="0" y="-0.1em" dy="1.1em">保存所需表示</tspan></text></g></g><g transform="translate(195.031, 260.6)"><g transform="translate(-38, -12)"><rect x="-2" y="0" width="76" height="24" fill="#f7f5ef" opacity="0.5"/><text y="-10.1" fill="#183d47"><tspan x="0" y="-0.1em" dy="1.1em">显式保留</tspan></text></g></g><g transform="translate(195.031, 402.4)"><g transform="translate(-47, -12)"><rect x="-2" y="0" width="94" height="24" fill="#f7f5ef" opacity="0.5"/><text y="-10.1" fill="#183d47"><tspan x="0" y="-0.1em" dy="1.1em">创建新引用</tspan></text></g></g><g transform="translate(156.031, 564)"><g transform="translate(-20, -12)"><rect x="-2" y="0" width="40" height="24" fill="#f7f5ef" opacity="0.5"/><text y="-10.1" fill="#183d47"><tspan x="0" y="-0.1em" dy="1.1em">读取</tspan></text></g></g><g transform="translate(156.031, 705.8)"><g transform="translate(-85.531, -12)"><rect x="-2" y="0" width="171.062" height="24" fill="#f7f5ef" opacity="0.5"/><text y="-10.1" fill="#183d47"><tspan x="0" y="-0.1em" dy="1.1em">计量完整 stdout 字节</tspan></text></g></g><g transform="translate(374.344, 564)"><g transform="translate(-38, -12)"><rect x="-2" y="0" width="76" height="24" fill="#f7f5ef" opacity="0.5"/><text y="-10.1" fill="#183d47"><tspan x="0" y="-0.1em" dy="1.1em">选定快照</tspan></text></g></g><g transform="translate(573.605, 564)"><g transform="translate(-40.508, -12)"><rect x="-2" y="0" width="81.016" height="24" fill="#f7f5ef" opacity="0.5"/><text y="-10.1" fill="#183d47"><tspan x="0" y="-0.1em" dy="1.1em">选定 brief</tspan></text></g></g><g transform="translate(524.352, 705.8)"><g transform="translate(-74, -12)"><rect x="-2" y="0" width="148" height="24" fill="#f7f5ef" opacity="0.5"/><text y="-10.1" fill="#183d47"><tspan x="0" y="-0.1em" dy="1.1em">本地写入；不传输</tspan></text></g></g><g transform="translate(524.352, 868.4)"><g transform="translate(-65, -12)"><rect x="-2" y="0" width="130" height="24" fill="#f7f5ef" opacity="0.5"/><text y="-10.1" fill="#183d47"><tspan x="0" y="-0.1em" dy="1.1em">在接收位置检查</tspan></text></g></g><g transform="translate(524.352, 1010.2)"><g transform="translate(-65, -12)"><rect x="-2" y="0" width="130" height="24" fill="#f7f5ef" opacity="0.5"/><text y="-10.1" fill="#183d47"><tspan x="0" y="-0.1em" dy="1.1em">检查后按需重读</tspan></text></g></g><g transform="translate(195.031, 47.9)"><rect x="-103" y="-39.9" width="206" height="79.8" fill="#eaf0f7" stroke="#345c8b" stroke-width="1.6px"/><g transform="translate(0, -19.9)"><text y="-10.1" fill="#183d47" text-anchor="middle"><tspan x="0" y="-0.1em" dy="1.1em">现有来源工具</tspan><tspan x="0" y="1em" dy="1.1em">已经取得的材料</tspan></text></g></g><g transform="translate(195.031, 189.7)"><rect x="-111.016" y="-39.9" width="222.031" height="79.8" fill="#ffffff" stroke="#8a9fa3" stroke-width="1.6px"/><g transform="translate(0, -19.9)"><text y="-10.1" fill="#183d47" text-anchor="middle"><tspan x="0" y="-0.1em" dy="1.1em">选定 UTF-8 文件</tspan><tspan x="0" y="1em" dy="1.1em">文本或 Markdown</tspan></text></g></g><g transform="translate(195.031, 331.5)"><rect x="-183.062" y="-39.9" width="366.125" height="79.8" fill="#f6edd9" stroke="#805a28" stroke-width="1.6px"/><g transform="translate(0, -19.9)"><text y="-10.1" fill="#183d47" text-anchor="middle"><tspan x="0" y="-0.1em" dy="1.1em">evidence.py capture</tspan><tspan x="0" y="1em" dy="1.1em">明确 store、source、representation</tspan></text></g></g><g transform="translate(195.031, 483.2)"><rect x="-144.016" y="-49.8" width="288.031" height="99.6" fill="#ffffff" stroke="#8a9fa3" stroke-width="1.6px"/><g transform="translate(0, -29.8)"><text y="-10.1" fill="#183d47" text-anchor="middle"><tspan x="0" y="-0.1em" dy="1.1em">本地 snapshot / s-ref</tspan><tspan x="0" y="1em" dy="1.1em">完整暂存 → 不覆盖地发布</tspan><tspan x="0" y="2.1em" dy="1.1em">旧引用继续读取旧内容</tspan></text></g></g><g transform="translate(156.031, 634.9)"><rect x="-146.516" y="-39.9" width="293.031" height="79.8" fill="#f6edd9" stroke="#805a28" stroke-width="1.6px"/><g transform="translate(0, -19.9)"><text y="-10.1" fill="#183d47" text-anchor="middle"><tspan x="0" y="-0.1em" dy="1.1em">evidence.py read / find</tspan><tspan x="0" y="1em" dy="1.1em">精确行段 / 范围内字面查找</tspan></text></g></g><g transform="translate(156.031, 787.1)"><rect x="-148.031" y="-50.3" width="296.062" height="100.6" fill="#ffffff" stroke="#8a9fa3" stroke-width="1.6px"/><g transform="translate(0, -30.3)"><text y="-10.1" fill="#183d47" text-anchor="middle"><tspan x="0" y="-0.1em" dy="1.1em">有界 JSON 输出</tspan><tspan x="0" y="1em" dy="1.1em">整窗返回或说明 omission</tspan><tspan x="0" y="2.1em" dy="1.1em">处理 first_omitted 后再续读</tspan></text></g></g><g transform="translate(573.605, 483.2)"><rect x="-130" y="-39.9" width="260" height="79.8" fill="#ffffff" stroke="#8a9fa3" stroke-width="1.6px"/><g transform="translate(0, -19.9)"><text y="-10.1" fill="#183d47" text-anchor="middle"><tspan x="0" y="-0.1em" dy="1.1em">显式研究 brief</tspan><tspan x="0" y="1em" dy="1.1em">目标、选定材料与范围</tspan></text></g></g><g transform="translate(524.352, 634.9)"><rect x="-134.523" y="-39.9" width="269.047" height="79.8" fill="#f6edd9" stroke="#805a28" stroke-width="1.6px"/><g transform="translate(0, -19.9)"><text y="-10.1" fill="#183d47" text-anchor="middle"><tspan x="0" y="-0.1em" dy="1.1em">packet.py create</tspan><tspan x="0" y="1em" dy="1.1em">只复制选定 refs 与 brief</tspan></text></g></g><g transform="translate(524.352, 787.1)"><rect x="-184.594" y="-49.8" width="369.188" height="99.6" fill="#ffffff" stroke="#8a9fa3" stroke-width="1.6px"/><g transform="translate(0, -29.8)"><text y="-10.1" fill="#183d47" text-anchor="middle"><tspan x="0" y="-0.1em" dy="1.1em">新目录 / Portable packet</tspan><tspan x="0" y="1em" dy="1.1em">brief.md + evidence/ + manifest.json</tspan><tspan x="0" y="2.1em" dy="1.1em">manifest 最后写入</tspan></text></g></g><g transform="translate(524.352, 939.3)"><rect x="-112" y="-39.9" width="224" height="79.8" fill="#f6edd9" stroke="#805a28" stroke-width="1.6px"/><g transform="translate(0, -19.9)"><text y="-10.1" fill="#183d47" text-anchor="middle"><tspan x="0" y="-0.1em" dy="1.1em">packet.py inspect</tspan><tspan x="0" y="1em" dy="1.1em">检查成员与可读性</tspan></text></g></g><g transform="translate(524.352, 1091)"><rect x="-147.047" y="-49.8" width="294.094" height="99.6" fill="#eaf0f7" stroke="#345c8b" stroke-width="1.6px"/><g transform="translate(0, -29.8)"><text y="-10.1" fill="#183d47" text-anchor="middle"><tspan x="0" y="-0.1em" dy="1.1em">接手者 / Recipient</tspan><tspan x="0" y="1em" dy="1.1em">通过 evidence.py 重读副本</tspan><tspan x="0" y="2.1em" dy="1.1em">不再依赖原 store</tspan></text></g></g></svg>
