<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1274.031 693" role="img" aria-labelledby="title desc" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="18" fill="#183D47"><rect x="0" y="0" width="1274.031" height="693" fill="#F7F5EF"/><title id="title">Soundings — 谁负责什么 / responsibilities</title><desc id="desc">Soundings is a package of independent instructions read by a coordinating agent, not four sequential agents. Codex coordinates the current task, uses existing domain methods and tools, maintains working understanding and delivers the result. The context is not a new database.</desc><marker refX="5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto" viewBox="0 0 10 10" id="m0"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526970" stroke="#526970" stroke-width="1px" stroke-dasharray="1px, 0px"/></marker><path d="M318,47.9L452,47.9L595.15,135.168" fill="none" stroke="#526970" stroke-width="1.5px" marker-end="url(#m0)"/><path d="M727.82,137.25L849.031,61.45L920.031,61.45" fill="none" stroke="#526970" stroke-width="1.5px"/><path d="M792.031,177.15L849.031,177.15L925.031,177.15" fill="none" stroke="#526970" stroke-width="1.5px" marker-end="url(#m0)"/><path d="M368,399.4L452,399.4L623.192,219.944" fill="none" stroke="#526970" stroke-width="1.5px" marker-end="url(#m0)"/><path d="M699.388,217.05L849.031,385.85L902.031,385.85" fill="none" stroke="#526970" stroke-width="1.5px" marker-end="url(#m0)"/><g transform="translate(452, 47.9)"><g transform="translate(-38, -12)"><rect x="-2" y="0" width="76" height="24" fill="#f7f5ef" opacity="0.5"/><text y="-10.1" fill="#183d47"><tspan x="0" y="-0.1em" dy="1.1em">提出委托</tspan></text></g></g><g transform="translate(849.031, 61.45)"><g transform="translate(-20, -12)"><rect x="-2" y="0" width="40" height="24" fill="#f7f5ef" opacity="0.5"/><text y="-10.1" fill="#183d47"><tspan x="0" y="-0.1em" dy="1.1em">维护</tspan></text></g></g><g transform="translate(849.031, 177.15)"><g transform="transla